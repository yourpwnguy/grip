[package]
name = "grip"
version = "0.1.0"
edition = "2024"
description = "grip — TLS handshake inspector + fingerprinter (JA3/JA4/JA4S) with live and pcap modes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourpwnguy/grip"
keywords = ["tls", "ja3", "ja4", "fingerprint", "pcap"]
categories = ["network-programming", "command-line-utilities"]
rust-version = "1.88"

# https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
md-5 = "0.10"
x509-parser = "0.16"
phf = { version = "0.11", features = ["macros"] }
anstream = "0.6"
chrono = "0.4"
hex = "0.4"
digest = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
terminal_size = "0.4"

[build-dependencies]
phf_codegen = "0.11"
csv = "1.3"

[dev-dependencies]
insta = "1.39"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"

[[bench]]
name = "parse_bench"
harness = false
